name: acorn systems
description: >-
  Acorn is a Time-Driven Activity-Based Costing (TD-ABC) and profitability-management
  platform for multi-dimensional cost-to-serve analysis, precisely attributing direct
  and indirect costs against products, customers, regions, business units and facilities.
  It offers what-if scenario modeling, shared-services optimization, custom business-process
  modeling, and OLAP/analytics for pricing, supplier negotiation and supply-chain decisions.
  Originally Acorn Systems, the product is now owned and operated by IgniteTech (an
  ESW Capital enterprise-software company); the acornsys.com domain 301-redirects into
  IgniteTech's software library. No public API, developer portal, SDK, or machine-readable
  specification is published for the product.
